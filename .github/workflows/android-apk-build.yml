name: Android APK Build & Test

on:
  push:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/android-apk-build.yml'
  pull_request:
    paths:
      - 'mobile-android/**'
      - '.github/workflows/android-apk-build.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode optional release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
            echo "ANDROID_KEYSTORE_PATH=$PWD/release-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured; using debug signing fallback."
          fi

      - name: Run unit tests, lint and assemble APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintDebug assembleRelease assembleDebug --stacktrace

      - name: Report APK sizes
        run: |
          echo "## Tamaño de APKs generadas" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and test report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: totp-soberano-apks
          path: |
            mobile-android/app/build/outputs/apk/release/*.apk
            mobile-android/app/build/outputs/apk/debug/*.apk
            mobile-android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error

      - name: Clean temporary keystore
        if: always()
        run: rm -f release-keystore.jks
